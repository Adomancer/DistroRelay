# Build distrorelay.exe di mesin Windows bersih. Push tag v* = test + build + selftest, lalu rilis DRAFT berisi .exe
# dan SHA256-nya (dipublikasikan manual dari halaman Releases). Jalankan manual (workflow_dispatch) = hanya artifact.
name: Rilis exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Action dipin ke SHA commit (bukan tag yang bisa dipindah), karena job ini boleh menulis ke halaman rilis.
    # Untuk memperbarui: git ls-remote https://github.com/actions/<nama>.git 'refs/tags/v*'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Pasang dependensi
        run: python -m pip install -c packaging/constraints.txt -e ".[dev,build]"
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: python -m PyInstaller packaging/distrorelay.spec --noconfirm
      - name: Selftest exe
        run: dist\distrorelay.exe selftest
      - name: SHA256
        run: |
          $hash = (Get-FileHash dist\distrorelay.exe -Algorithm SHA256).Hash.ToLower()
          "$hash *distrorelay.exe" | Out-File dist\distrorelay.exe.sha256 -Encoding ascii
          Get-Content dist\distrorelay.exe.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: distrorelay-exe
          path: |
            dist/distrorelay.exe
            dist/distrorelay.exe.sha256
      - name: Rilis draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/distrorelay.exe dist/distrorelay.exe.sha256
          --draft --prerelease --title "DistroRelay ${{ github.ref_name }}" --notes-file docs/release-notes.md
